<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>História</title>
    <link rel="stylesheet" href="index.html/css/css/style.css">
    <link rel="stylesheet" href="index.html/css/css/geografia.css">
    <style>
        body {
            background:
                radial-gradient(circle at top, rgba(255, 213, 91, 0.22), transparent 32%),
                linear-gradient(135deg, #231400, #4e3401 48%, #1b1000);
            color: #fff8db;
        }

        header {
            border-bottom: 1px solid rgba(255, 214, 86, 0.55);
        }

        .pyramid-visual {
            font-size: 3rem;
            display: block;
            text-align: center;
            margin: 6px 0 0;
            filter: drop-shadow(0 0 14px rgba(255, 214, 86, 0.5));
        }

        .niveis button,
        #alternativas button {
            background: linear-gradient(135deg, #6c4800, #c08c0f);
            color: #fff9df;
            border: 1px solid rgba(255, 224, 132, 0.45);
        }

        #progresso {
            background: linear-gradient(90deg, #ffbe1f, #ffd96e);
        }

        .correto { background: rgba(149, 102, 12, 0.92); }
        .incorreto { background: rgba(123, 30, 30, 0.92); }
    </style>
</head>
<body>
    <header>
        <a href="index.html/index.html">← Menu principal</a>
        <h1>História</h1>
        <span class="pyramid-visual">🏜️ ⛩️ 🏺</span>
    </header>

    <main>
        <section id="tela-niveis">
            <h2>Escolha sua série</h2>

            <div class="niveis">
                <button onclick="iniciarJogo('7ano')">7º ano</button>
                <button onclick="iniciarJogo('8ano')">8º ano</button>
                <button onclick="iniciarJogo('9ano')">9º ano</button>
                <button onclick="iniciarJogo('1medio')">1º Ensino Médio</button>
                <button onclick="iniciarJogo('2medio')">2º Ensino Médio</button>
                <button onclick="iniciarJogo('3medio')">3º Ensino Médio</button>
            </div>
        </section>

        <section id="tela-jogo" class="escondido">
            <p id="contador"></p>
            <div class="barra"><div id="progresso"></div></div>
            <h2 id="pergunta"></h2>
            <div id="alternativas"></div>

            <div id="feedback" class="escondido">
                <h3 id="mensagem-feedback"></h3>
                <p id="explicacao"></p>
                <button onclick="proximaPergunta()">Continuar</button>
            </div>
        </section>

        <section id="tela-resultado" class="escondido">
            <h2>Atividade concluída!</h2>
            <p id="resultado"></p>
            <button onclick="voltarParaNiveis()">Escolher outro nível</button>
            <a href="index.html/index.html" class="botao-link">Voltar ao menu</a>
        </section>
    </main>

    <script src="index.html/css/js/perguntas-historia.js"></script>
    <script>
        const perguntas = perguntasHistoria;
    </script>
    <script src="index.html/css/js/geografia.js"></script>
</body>
</html>
