<!DOCTYPE html>
<!-- Menu principal: mostra o perfil, permite escolher uma matéria e acessar a loja. -->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle - Arena de Quizes</title>
    <link rel="stylesheet" href="css/fundo.css">
    <link rel="stylesheet" href="css/menu.css">
</head>
<body>
    <header class="barra-superior-status">
        <div class="perfil-usuario-bloco">
            <div class="moldura-avatar">
                <span class="iniciais-avatar" id="iniciaisAvatar">U</span>
                <div class="emblema-nivel" id="nivelUsuario">1</div>
            </div>
            <div class="informacoes-perfil">
                <div class="nome-usuario" id="nomeUsuario">Carregando...</div>
                <div class="barra-xp-recipiente">
                    <div class="barra-xp-preenchimento" id="preenchimentoBarraXp"></div>
                </div>
                <span class="texto-xp" id="textoXp">0 / 250 XP</span>
            </div>
        </div>

        <div class="moedas-container">
            <span class="icone-moeda">P</span>
            <span id="saldoPontos">0</span> <small>Pontos</small>
        </div>

        <div class="controles-direita">
            <button class="botao-abrir-loja" id="btnAbrirLoja">Loja</button>
            <button class="botao-abrir-loja" id="btnLogout">Sair</button>
        </div>
    </header>

    <main class="tela-lobby-premium">
        <div class="carrossel-container-portais">
            <button class="seta-navegacao seta-esquerda" id="botaoAnterior">&#10216;</button>

            <a id="iniciar-jogar">
            <div class="recipiente-portal-moldura" id="recipienteMapa">
                <div class="circulo-portal-interno" id="plataformaMapa">
                        <div class="overlay-particulas-materia" id="particulasMateria"></div>
                        <img class="imagem-central-materia" id="imagemMateria" alt="" hidden>
                        <div class="simbolo-central-materia" id="simboloMateria">M</div>
            
                </div>
            </div>
            </a>

            <button class="seta-navegacao seta-direita" id="botaoProximo">&#10217;</button>
        </div>

        <div class="painel-selecao-inferior">
            <div class="distintivo-materia" id="distintivoMateria"></div>
            <h1 class="titulo-materia-ativa" id="tituloMateria">Carregando...</h1>
            <button class="botao-jogar-rank" id="botaoJogarRank">INICIAR</button>
        </div>
    </main>

    <div class="janela-modal-loja" id="modalLoja">
        <div class="conteudo-modal-loja">
            <div class="cabecalho-loja">
                <h2>Loja e customização</h2>
                <button class="fechar-loja-btn" id="btnFecharLoja">&times;</button>
            </div>
            <section class="desafio-boss-loja">
                <div>
                    <h3>Desafio do Boss</h3>
                    <p>Enfrente um boss aleatório na matéria selecionada.</p>
                    <strong>100 pontos</strong>
                </div>
                <button type="button" id="btnComprarDesafioBoss">Iniciar Boss</button>
            </section>
            <p class="mensagem-loja" id="mensagemLoja" aria-live="polite"></p>
            <div class="abas-loja-categorias">
                <button class="aba-item ativa" type="button" data-category="avatar">Avatares</button>
                <button class="aba-item" type="button" data-category="acessorio">Acessórios</button>
            </div>
            <div class="grade-itens-loja" id="gradeItensLoja"></div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/menu.js"></script>
</body>
</html>
