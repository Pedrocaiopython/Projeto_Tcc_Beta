<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ciências</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/geografia.css">
    <style>
        body {
            background:
                radial-gradient(circle at top, rgba(78, 255, 154, 0.22), transparent 35%),
                linear-gradient(135deg, #02170a, #07391f 45%, #071d11);
            color: #f2fff4;
        }

        header {
            border-bottom: 1px solid rgba(119, 255, 163, 0.5);
        }

        .hero-gif {
            width: 130px;
            height: 130px;
            object-fit: contain;
            display: block;
            margin: 0 auto 12px;
            filter: drop-shadow(0 0 18px rgba(101, 255, 178, 0.7));
        }

        .hero-title {
            text-align: center;
            font-size: 2.4rem;
            margin: 0;
            color: #9effb5;
            text-shadow: 0 0 12px rgba(121, 255, 171, 0.6);
        }

        .niveis button,
        #alternativas button {
            background: linear-gradient(135deg, #152b18, #1e5731);
            color: #eefdf1;
            border: 1px solid rgba(170, 255, 196, 0.45);
        }

        #progresso {
            background: linear-gradient(90deg, #47d96d, #79ff9f);
        }

        .correto { background: rgba(20, 93, 46, 0.92); }
        .incorreto { background: rgba(139, 35, 35, 0.92); }
    </style>
</head>
<body>
    <header>
        <a href="menu_principal.html">← Menu principal</a>
        <h1 class="hero-title">Ciências</h1>
        <img
            class="hero-gif"
            src="https://cdn.pixabay.com/animation/2021/08/21/02/17/02-17-38-842_512.gif"
            alt="Moleculas em formação"
        >
    </header>

    <main>
        <section id="tela-niveis">
            <h2>Escolha sua série</h2>

            <div class="niveis">
                <button onclick="iniciarJogo('7ano')">7º ano</button>
                <button onclick="iniciarJogo('8ano')">8º ano</button>
                <button onclick="iniciarJogo('9ano')">9º ano</button>
                <button onclick="iniciarJogo('1medio')">1º Ensino Médio</button>
                <button onclick="iniciarJogo('2medio')">2º Ensino Médio</button>
                <button onclick="iniciarJogo('3medio')">3º Ensino Médio</button>
            </div>
        </section>

        <section id="tela-jogo" class="escondido">
            <p id="contador"></p>
            <div class="barra"><div id="progresso"></div></div>
            <h2 id="pergunta"></h2>
            <div id="alternativas"></div>

            <div id="feedback" class="escondido">
                <h3 id="mensagem-feedback"></h3>
                <p id="explicacao"></p>
                <button onclick="proximaPergunta()">Continuar</button>
            </div>
        </section>

        <section id="tela-resultado" class="escondido">
            <h2>Atividade concluída!</h2>
            <p id="resultado"></p>
            <button onclick="voltarParaNiveis()">Escolher outro nível</button>
            <a href="index.html/index.html" class="botao-link">Voltar ao menu</a>
        </section>
    </main>

    <script src="js/perguntas-ciencias.js"></script>
    <script>
        const perguntas = perguntasCiencias;
    </script>
    <script src="js/geografia.js"></script>
</body>
</html>
