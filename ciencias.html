<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ciências</title>
    <link rel="stylesheet" href="css/materias-base.css">
</head>
<body class="tema-ciencias">
    <main class="container-principal">
        <section id="tela-niveis">
            <h2 class="titulo-secao">Escolha sua série</h2>
            <div class="niveis">
                <button onclick="iniciarJogo('7ano')">7º ano</button>
                <button onclick="iniciarJogo('8ano')">8º ano</button>
                <button onclick="iniciarJogo('9ano')">9º ano</button>
                <button onclick="iniciarJogo('1medio')">1º Ensino<br>Médio</button>
                <button onclick="iniciarJogo('2medio')">2º Ensino<br>Médio</button>
                <button onclick="iniciarJogo('3medio')">3º Ensino<br>Médio</button>
            </div>

            <div class="container-botao-voltar">
                <a href="menu_principal.html" class="botao-link">← Voltar ao Menu</a>
            </div>
        </section>

        <section id="tela-jogo" class="escondido">
            <p id="contador">PERGUNTA 1 / 4</p>
            <div class="barra"><div id="progresso"></div></div>
            <h2 id="pergunta">Carregando pergunta...</h2>
            <div id="alternativas"></div>

            <div id="feedback" class="escondido">
                <h3 id="mensagem-feedback"></h3>
                <p id="explicacao"></p>
                <button onclick="proximaPergunta()">Continuar</button>
            </div>
        </section>

        <section id="tela-resultado" class="escondido">
            <h2 class="titulo-secao">Resultados Finais</h2>
            <div class="circulo-resultado">
                <div id="resultado"></div>
            </div>

            <div class="botoes-finalizacao">
                <button onclick="voltarParaNiveis()">Jogar Novamente</button>
                <a href="menu_principal.html" class="botao-link">Voltar ao Lobby</a>
            </div>
        </section>
    </main>

    <script src="js/perguntas-ciencias.js"></script>
    <script>
        window.perguntas = perguntasCiencias;
    </script>
    <script src="js/banco-complementar.js"></script>
    <script src="js/api.js"></script>
    <script src="js/quiz-utils.js"></script>
    <script src="js/quiz-engine.js"></script>
</body>
</html>
