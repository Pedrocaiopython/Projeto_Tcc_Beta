<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Estação de Aprendizagem</title>
  <style>
    :root {
      --bg: #050b1e;
      --panel: rgba(10, 16, 39, 0.9);
      --panel-strong: #101b38;
      --line: rgba(148, 163, 184, 0.24);
      --text: #ebf3ff;
      --muted: #a7b8da;
      --primary: #4f8cff;
      --primary-strong: #3a69d8;
      --success: #2ecc71;
      --danger: #ff6b6b;
      --shadow: rgba(15, 23, 42, 0.76);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top, rgba(79, 140, 255, 0.32), transparent 24%),
        linear-gradient(135deg, #030712 0%, #0a1127 46%, #151d34 100%);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    .auth-shell {
      width: min(92vw, 420px);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 30px 60px var(--shadow);
      padding: 26px 22px 22px;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .auth-header h1 {
      margin: 0 0 8px;
      font-size: clamp(1.6rem, 3vw, 2.1rem);
    }

    .auth-header p {
      margin: 0;
      color: var(--muted);
    }

    .auth-tabs {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 18px;
      background: rgba(148, 163, 184, 0.08);
      border-radius: 12px;
      padding: 6px;
    }

    .auth-tab {
      border: none;
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      font-weight: 700;
      padding: 10px 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .auth-tab.active {
      background: linear-gradient(135deg, var(--primary), var(--primary-strong));
      color: white;
      box-shadow: 0 10px 20px rgba(79, 140, 255, 0.3);
    }

    .auth-form { display: none; }
    .auth-form.active { display: block; }

    .auth-form label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-weight: 600;
    }

    .auth-form input {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 14px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: rgba(15, 23, 42, 0.9);
      color: var(--text);
      font-size: 1rem;
    }

    .auth-form button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: linear-gradient(135deg, var(--primary), var(--primary-strong));
      color: white;
      font-weight: 700;
      font-size: 1rem;
    }

    .status-box {
      min-height: 26px;
      margin-top: 12px;
      font-size: 0.94rem;
      color: var(--muted);
    }

    .status-box.success { color: var(--success); }
    .status-box.error { color: var(--danger); }
  </style>
</head>
<body>
  <main class="auth-shell">
    <header class="auth-header">
      <h1>Estação de Aprendizagem</h1>
      <p>Entre para continuar seu progresso</p>
    </header>

    <div class="auth-tabs" aria-label="Escolha de autenticação">
      <button class="auth-tab active" type="button" data-target="loginForm">Login</button>
      <button class="auth-tab" type="button" data-target="registerForm">Cadastro</button>
    </div>

    <form id="loginForm" class="auth-form active" novalidate>
      <label for="loginEmail">E-mail</label>
      <input id="loginEmail" name="email" type="email" placeholder="seu@email.com" required />

      <label for="loginPassword">Senha</label>
      <input id="loginPassword" name="password" type="password" placeholder="Sua senha" required />

      <button type="submit">Entrar</button>
    </form>

    <form id="registerForm" class="auth-form" novalidate>
      <label for="registerName">Nome</label>
      <input id="registerName" name="name" type="text" placeholder="Seu nome" required />

      <label for="registerEmail">E-mail</label>
      <input id="registerEmail" name="email" type="email" placeholder="seu@email.com" required />

      <label for="registerPassword">Senha</label>
      <input id="registerPassword" name="password" type="password" placeholder="Mínimo 6 caracteres" required />

      <button type="submit">Criar conta</button>
    </form>

    <div id="authMessage" class="status-box" aria-live="polite"></div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
