<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Matemático</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/geografia.css">
    <style>
        body {
            background:
                radial-gradient(circle at top, rgba(255, 91, 91, 0.24), transparent 30%),
                linear-gradient(135deg, #15050a, #32070f 50%, #0c0305);
            color: #fff4f4;
        }

        header {
            border-bottom: 1px solid rgba(255, 95, 95, 0.5);
        }

        .niveis button,
        #alternativas button {
            background: linear-gradient(135deg, #4a0b14, #b12032);
            color: #fff;
            border: 1px solid rgba(255, 170, 170, 0.45);
        }

        #progresso {
            background: linear-gradient(90deg, #ff5a70, #ffb77b);
        }

        .correto { background: rgba(15, 197, 31, 0.92); }
        .incorreto { background: rgba(121, 19, 19, 0.92); }
    </style>
</head>
<body>
    <header>
        <a href="menu_principal.html">← Menu principal</a>
        <h1>Matemática</h1>
    </header>

    <main>
        <section id="tela-niveis">
            <h2>Escolha sua série</h2>
            <div class="niveis">
                <button onclick="iniciarJogo('7ano')">7º ano</button>
                <button onclick="iniciarJogo('8ano')">8º ano</button>
                <button onclick="iniciarJogo('9ano')">9º ano</button>
                <button onclick="iniciarJogo('1medio')">1º Ensino Médio</button>
                <button onclick="iniciarJogo('2medio')">2º Ensino Médio</button>
                <button onclick="iniciarJogo('3medio')">3º Ensino Médio</button>
            </div>
        </section>

        <section id="tela-jogo" class="escondido">
            <p id="contador"></p>
            <div class="barra"><div id="progresso"></div></div>
            <h2 id="pergunta"></h2>
            <div id="alternativas"></div>

            <div id="feedback" class="escondido">
                <h3 id="mensagem-feedback"></h3>
                <p id="explicacao"></p>
                <button onclick="proximaPergunta()">Continuar</button>
            </div>
        </section>

        <section id="tela-resultado" class="escondido">
            <h2>Atividade concluída!</h2>
            <p id="resultado"></p>
            <button onclick="voltarParaNiveis()">Escolher outro nível</button>
            <a href="index.html/index.html" class="botao-link">Voltar ao menu</a>
        </section>
    </main>

    <script src="js/perguntas-matematica.js"></script>
    <script>
        window.perguntas = perguntasMatematica;
    </script>
    <script src="js/geografia.js"></script>
</body>
</html>
